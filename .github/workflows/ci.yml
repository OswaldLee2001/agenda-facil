name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agenda_user
          POSTGRES_PASSWORD: agenda_test
          POSTGRES_DB: agenda_facil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agenda_user -d agenda_facil_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://agenda_user:agenda_test@127.0.0.1:5432/agenda_facil_test
      TEST_DATABASE_URL: postgresql+psycopg://agenda_user:agenda_test@127.0.0.1:5432/agenda_facil_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1
          pip install httpx2

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head

      - name: Run tests
        run: pytest -v

      - name: Check migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic check

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: backend
        run: docker build -t agenda-facil-api:ci .
